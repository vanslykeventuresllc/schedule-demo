<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WYBSL Scheduling Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">W</div>
        <div><strong>WYBSL</strong><span>Scheduling Studio</span></div>
      </div>
      <nav id="nav" aria-label="Primary navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span><span>Overview</span></button>
        <p class="nav-label">Configure</p>
        <button class="nav-item" data-view="season"><span class="nav-icon">◫</span><span>Season setup</span><span class="nav-check">✓</span></button>
        <button class="nav-item" data-view="divisions"><span class="nav-icon">◇</span><span>Divisions & teams</span><span class="nav-check">✓</span></button>
        <button class="nav-item" data-view="fields"><span class="nav-icon">⌖</span><span>Fields</span><span class="nav-check">✓</span></button>
        <button class="nav-item" data-view="rules"><span class="nav-icon">≡</span><span>Rules & priorities</span><span class="nav-check">✓</span></button>
        <p class="nav-label">Build & manage</p>
        <button class="nav-item" data-view="schedule"><span class="nav-icon">▦</span><span>Generate & review</span></button>
        <button class="nav-item" data-view="rainouts"><span class="nav-icon">☂</span><span>Rainout workbench</span></button>
        <button class="nav-item" data-view="export"><span class="nav-icon">⇩</span><span>Approval & export</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-pill"><span></span>Local demo only</div>
        <p>Changes stay in this browser.</p>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div class="season-switcher"><span>Season</span><strong id="header-season">Spring 2026</strong><span class="chevron">⌄</span></div>
        <div class="top-actions">
          <span class="saved" id="save-status">● Saved locally</span>
          <button class="icon-button" aria-label="Help">?</button>
          <div class="avatar">AD</div>
        </div>
      </header>
      <div id="app" class="page"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
